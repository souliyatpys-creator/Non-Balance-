    html += '<div class="stack">' +
      '<div class="kpi-card"><div class="kpi-label">ຈຳນວນທີ່ຂາຍ / ເບີກໄດ້ມື້ນີ້</div><div class="kpi-val mono">' + fmt(todayQty) + ' ອັນ</div></div>' +
      '<div class="kpi-card"><div class="kpi-label">ມູນຄ່າຍອດຂາຍລວມມື້ນີ້</div><div class="kpi-val mono" style="color:var(--emerald)">₭' + fmt(todayVal) + '</div></div>' +

    '</div>';

    html += '<div class="stack">' + filtered.map(function(p) {
      var totalStock = p.variants.reduce(function(s, v) { return s + v.stockQty; }, 0);

  function renderMatrixModal() {

  function renderOwnerAnalytics() {
    var activeOrders = state.orders.filter(function(o) { return o.status !== 'CANCELLED'; });
    var periodOrders = activeOrders.filter(function(o) { return state.ownerPeriod === 'DAILY' ? isToday(o.createdAt) : isThisMonth(o.createdAt); });
    var totalStockUnits = 0, totalStockVal = 0, lowStockCount = 0;
    state.products.forEach(function(p) {
      p.variants.forEach(function(v) {
        totalStockUnits += v.stockQty;
        totalStockVal += v.stockQty * p.sellPrice;
        if (v.stockQty <= v.lowStockThreshold) lowStockCount++;
      });
    });
    var periodQty = periodOrders.reduce(function(s, o) { return s + o.totalItems; }, 0);
    var periodVal = periodOrders.reduce(function(s, o) { return s + o.totalValue; }, 0);

    var staffSummary = state.users.filter(function(u) { return u.role === 'STAFF'; }).map(function(u) {
      var dQty = 0, dVal = 0, mQty = 0, mVal = 0;
      activeOrders.forEach(function(o) {
        if (o.staffId !== u.id) return;
        if (isThisMonth(o.createdAt)) { mQty += o.totalItems; mVal += o.totalValue; }
        if (isToday(o.createdAt)) { dQty += o.totalItems; dVal += o.totalValue; }
      });
      return { id: u.id, name: u.name, dQty: dQty, dVal: dVal, mQty: mQty, mVal: mVal };
    });

    var tabs = [

      if (u) { state.currentUser = u; state.pinInput = ''; state.pinError = ''; render(); }
    } else if (act === 'pin-clear') { state.pinInput = ''; state.pinError = ''; render();
    } else if (act === 'pin-back') { state.pinInput = state.pinInput.slice(0, -1); render();
    } else if (act === 'logout') { state.currentUser = null; state.cart = []; render();
    } else if (act === 'staff-cat') { state.staffCategory = val; render();
    } else if (act === 'open-matrix') {
      var p = state.products.find(function(x) { return x.id === id; });
      if (!p) return;
      var d = {};
      p.variants.forEach(function(v) {
        var c = state.cart.find(function(x) { return x.variantId === v.id; });
        d[v.id] = c ? c.qty : 0;
      });
      state.activeProductId = p.id; state.matrixDraft = d; render();
    } else if (act === 'close-matrix') { state.activeProductId = null; render();
    } else if (act === 'm-inc' || act === 'm-dec') {
      var p = state.products.find(function(x) { return x.id === state.activeProductId; });
      var v = p && p.variants.find(function(x) { return x.id === vid; });
      if (!v) return;
      state.matrixDraft[vid] = Math.max(0, Math.min(v.stockQty, (state.matrixDraft[vid] || 0) + (act === 'm-inc' ? 1 : -1)));
      render();
    } else if (act === 'apply-matrix') {
      var p = state.products.find(function(x) { return x.id === state.activeProductId; });
      if (!p) return;
      var rest = state.cart.filter(function(c) { return c.productId !== p.id; });
      var add = [];
      p.variants.forEach(function(v) {
        var q = Number(state.matrixDraft[v.id]) || 0;
        if (q > 0 && v.stockQty >= q) {
          add.push({ id: 'oi-' + v.id, productId: p.id, variantId: v.id, sku: p.sku, productName: p.name, imageUrl: p.imageUrl, colorName: v.colorName, colorHex: v.colorHex, size: v.size, qty: q, unitPrice: p.sellPrice });
        }
      });
      state.cart = rest.concat(add); state.activeProductId = null; render();
    } else if (act === 'open-cart') { state.cartDrawerOpen = true; render();
    } else if (act === 'close-cart') { state.cartDrawerOpen = false; render();
    } else if (act === 'c-inc' || act === 'c-dec') {
      state.cart = state.cart.map(function(c) {
        if (c.variantId !== vid) return c;
        var p = state.products.find(function(x) { return x.id === c.productId; });
        var v = p && p.variants.find(function(x) { return x.id === vid; });
        return Object.assign({}, c, { qty: Math.min(v ? v.stockQty : c.qty, c.qty + (act === 'c-inc' ? 1 : -1)) });
      }).filter(function(c) { return c.qty > 0; });
      render();
    } else if (act === 'c-del') { state.cart = state.cart.filter(function(c) { return c.variantId !== vid; }); render();
    } else if (act === 'confirm-order') {
      if (!state.cart.length) return;
      state.cart.forEach(function(it) {
        var p = state.products.find(function(x) { return x.id === it.productId; });
        var v = p && p.variants.find(function(x) { return x.id === it.variantId; });
        if (v) v.stockQty -= it.qty;
      });
      writeStore(KEYS.PRODUCTS, state.products);
      var now = new Date();
      var no = 'DSP-' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '-' + String(state.orders.length + 1).padStart(4,'0');
      state.orders.unshift({
        id: 'ord-' + Date.now(), orderNo: no, staffId: state.currentUser.id, staffName: state.currentUser.name,
        items: JSON.parse(JSON.stringify(state.cart)),
        totalItems: state.cart.reduce(function(s, i) { return s + i.qty; }, 0),
        totalValue: state.cart.reduce(function(s, i) { return s + i.qty * i.unitPrice; }, 0),
        status: 'COMPLETED', createdAt: now.toISOString()
      });
      writeStore(KEYS.ORDERS, state.orders);
      state.lastReceiptNo = no; state.cart = []; state.cartDrawerOpen = false; render();
    } else if (act === 'close-receipt') { state.lastReceiptNo = ''; render();
    } else if (act === 'open-my-history') { state.myHistoryOpen = true; render();
    } else if (act === 'close-my-history') { state.myHistoryOpen = false; render();
    } else if (act === 'cancel-own-order') {
      var ord = state.orders.find(function(o) { return o.id === id; });
      if (!ord || ord.status === 'CANCELLED') return;
      ord.items.forEach(function(it) {
        var p = state.products.find(function(x) { return x.id === it.productId; });
        var v = p && p.variants.find(function(x) { return x.id === it.variantId; });
        if (v) v.stockQty += it.qty;
      });
      ord.status = 'CANCELLED';
      writeStore(KEYS.PRODUCTS, state.products); writeStore(KEYS.ORDERS, state.orders);
      state.auditLogs.unshift({ id: 'aud-' + Date.now(), orderNo: ord.orderNo, editedByName: state.currentUser.name, reason: 'ພະນັກງານຍົກເລີກລາຍການຂອງຕົນເອງ', timestamp: new Date().toISOString() });
      writeStore(KEYS.AUDIT, state.auditLogs);
      render();
    } else if (act === 'owner-sec') { state.ownerSection = val; render();
    } else if (act === 'owner-tab') { state.ownerTab = val; render();
    } else if (act === 'open-stock-modal') { state.stockModalOpen = true; render();
    } else if (act === 'close-stock-modal') { state.stockModalOpen = false; render();
    } else if (act === 'view-order') { state.detailOrderId = id; render();
    } else if (act === 'close-detail-order') { state.detailOrderId = null; render();
    } else if (act === 'edit-order') {
      var ord = state.orders.find(function(o) { return o.id === id; });
      if (!ord) return;
      state.detailOrderId = null; state.editOrderId = ord.id; state.editOrderDraft = JSON.parse(JSON.stringify(ord.items)); render();
    } else if (act === 'close-edit-order') { state.editOrderId = null; render();
    } else if (act === 'eo-inc' || act === 'eo-dec') {
      var it = state.editOrderDraft[idx];
      if (it) it.qty = Math.max(0, it.qty + (act === 'eo-inc' ? 1 : -1));
      render();
    } else if (act === 'save-edit-order') {
      var rsn = (document.getElementById('eo-reason').value || '').trim() || 'ແກ້ໄຂໂດຍເຈົ້າຂອງຮ້ານ';
      var ord = state.orders.find(function(o) { return o.id === state.editOrderId; });
      if (!ord) return;
      state.editOrderDraft.forEach(function(ni) {
        var oi = ord.items.find(function(x) { return x.variantId === ni.variantId; });
        var delta = ni.qty - (oi ? oi.qty : 0);
        var p = state.products.find(function(x) { return x.id === ni.productId; });
        var v = p && p.variants.find(function(x) { return x.id === ni.variantId; });
        if (v) v.stockQty -= delta;
      });
      writeStore(KEYS.PRODUCTS, state.products);
      ord.items = state.editOrderDraft.filter(function(x) { return x.qty > 0; });
      ord.totalItems = ord.items.reduce(function(s, i) { return s + i.qty; }, 0);
      ord.totalValue = ord.items.reduce(function(s, i) { return s + i.qty * i.unitPrice; }, 0);
      ord.status = 'EDITED';
      writeStore(KEYS.ORDERS, state.orders);
      state.auditLogs.unshift({ id: 'aud-' + Date.now(), orderNo: ord.orderNo, editedByName: state.currentUser.name, reason: rsn, timestamp: new Date().toISOString() });
      writeStore(KEYS.AUDIT, state.auditLogs);
      state.editOrderId = null; render();
    } else if (act === 'new-product') {
      state.editProductDraft = { id: 'prod-' + Date.now(), sku: 'AT-NEW-' + (state.products.length + 1), name: '', category: 'ເຄື່ອງນຸ່ງຫົ່ມ', imageUrl: makeSvgImg('NEW ITEM', '#0f172a'), costPrice: 300, sellPrice: 690, variants: [] };
      render();
    } else if (act === 'edit-product') {
      var p = state.products.find(function(x) { return x.id === id; });
      if (p) { state.editProductDraft = JSON.parse(JSON.stringify(p)); render(); }
    } else if (act === 'close-edit-product') { state.editProductDraft = null; render();
    } else if (act === 'ep-add-variant') {
      var ep = state.editProductDraft;
      ep.sku = document.getElementById('ep-sku').value;
      ep.name = document.getElementById('ep-name').value;
      ep.sellPrice = Number(document.getElementById('ep-sell').value) || 0;
      var cn = (document.getElementById('ep-new-color').value || '').trim();
      var ch = document.getElementById('ep-new-hex').value || '#0f172a';
      var sz = (document.getElementById('ep-new-size').value || '').trim();
      var qt = Math.max(0, Number(document.getElementById('ep-new-qty').value) || 0);
      if (cn && sz) {
        ep.variants.push({ id: 'var-' + Date.now(), colorName: cn, colorHex: ch, size: sz, stockQty: qt, lowStockThreshold: 3 });
        render();
      }
    } else if (act === 'ep-del-variant') {
      state.editProductDraft.variants.splice(idx, 1); render();
    } else if (act === 'save-product') {
      var ep = state.editProductDraft;
      ep.sku = (document.getElementById('ep-sku').value || '').trim();
      ep.name = (document.getElementById('ep-name').value || '').trim() || 'ສິນຄ້າໃໝ່';
      ep.sellPrice = Number(document.getElementById('ep-sell').value) || 0;
      var pi = state.products.findIndex(function(x) { return x.id === ep.id; });
      if (pi !== -1) state.products[pi] = ep; else state.products.unshift(ep);
      writeStore(KEYS.PRODUCTS, state.products);
      state.editProductDraft = null; render();
    } else if (act === 'edit-staff') {
      state.editUserId = id;
      state.staffFormError = '';
      render();
    } else if (act === 'cancel-edit-staff') {
      state.editUserId = null;
      state.staffFormError = '';
      render();
    } else if (act === 'delete-staff') {
      if (state.currentUser && state.currentUser.id === id) return;
      state.users = state.users.filter(function(u) { return u.id !== id; });
      if (state.editUserId === id) state.editUserId = null;
      writeStore(KEYS.USERS, state.users);
      render();
    } else if (act === 'pick-palette-color') {
      var cname = btn.getAttribute('data-cname') || '';
      var chex = btn.getAttribute('data-chex') || '#2563eb';
      var nameInp = document.getElementById('ep-new-color');
      var hexInp = document.getElementById('ep-new-hex');
      if (nameInp) nameInp.value = cname;
      if (hexInp) hexInp.value = chex;
    } else if (act === 'save-staff') {
      var nm = (document.getElementById('new-staff-name').value || '').trim();
      var pn = (document.getElementById('new-staff-pin').value || '').trim();
      var rl = document.getElementById('new-staff-role').value;
      if (!nm) {
        state.staffFormError = 'ກະລຸນາປ້ອນຊື່ພະນັກງານ';
        render();
        return;
      }
      if (!/^\d{4}$/.test(pn)) {
        state.staffFormError = 'ລະຫັດ PIN ຕ້ອງເປັນຕົວເລກ 4 ຫຼັກ';
        render();
        return;
      }
      var dup = state.users.find(function(u) { return u.pin === pn && u.id !== state.editUserId; });
      if (dup) {
        state.staffFormError = 'ລະຫັດ PIN "' + pn + '" ຊ້ຳກັບ ' + dup.name;
        render();
        return;
      }
      state.staffFormError = '';
      if (state.editUserId) {
        state.users = state.users.map(function(u) {
          if (u.id !== state.editUserId) return u;
          return { id: u.id, name: nm, pin: pn, role: rl };
        });
        if (state.currentUser && state.currentUser.id === state.editUserId) {
          state.currentUser.name = nm;
          state.currentUser.pin = pn;
          state.currentUser.role = rl;
        }
        state.editUserId = null;
      } else {
        state.users.push({ id: 'usr-' + Date.now(), name: nm, pin: pn, role: rl });
      }
      writeStore(KEYS.USERS, state.users);
      render();
    }
  });

  document.addEventListener('input', function(e) {
    var inp = e.target;
    if (inp.getAttribute('data-input') === 'staff-search') {
      state.staffSearch = inp.value; render();
      var el = document.querySelector('[data-input="staff-search"]');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }
  });

  document.addEventListener('change', function(e) {
    if (e.target && e.target.id === 'ep-file' && state.editProductDraft) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      state.editProductDraft.sku = (document.getElementById('ep-sku')?.value || state.editProductDraft.sku);
      state.editProductDraft.name = (document.getElementById('ep-name')?.value || state.editProductDraft.name);
      state.editProductDraft.sellPrice = Number(document.getElementById('ep-sell')?.value) || state.editProductDraft.sellPrice;
      var reader = new FileReader();
      reader.onload = function() {
        if (typeof reader.result === 'string') {
          state.editProductDraft.imageUrl = reader.result;
          render();
        }
      };
      reader.readAsDataURL(file);
    }
  });

  
  // โหลดจาก Firebase ถ้ามี
  if (db) {
    db.ref('shared').once('value').then(function(snap) {
      var data = snap.val();
      if (data) {
        if (data.atelier_mobile_users_v1) state.users = data.atelier_mobile_users_v1;
        if (data.atelier_mobile_products_v1) state.products = data.atelier_mobile_products_v1;
        if (data.atelier_mobile_orders_v1) state.orders = data.atelier_mobile_orders_v1;
        if (data.atelier_mobile_audit_v1) state.auditLogs = data.atelier_mobile_audit_v1;
        render();
      }
    }).catch(function() { render(); });

    db.ref('shared').on('value', function(snap) {
      var data = snap.val();
      if (!data) return;
      if (data.atelier_mobile_users_v1) state.users = data.atelier_mobile_users_v1;
      if (data.atelier_mobile_products_v1) state.products = data.atelier_mobile_products_v1;
      if (data.atelier_mobile_orders_v1) state.orders = data.atelier_mobile_orders_v1;
      if (data.atelier_mobile_audit_v1) state.auditLogs = data.atelier_mobile_audit_v1;
      render();
    });
  }

render();
})();
</script>
</body>
</html>
